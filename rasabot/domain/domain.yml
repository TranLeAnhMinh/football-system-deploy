version: "3.1"

intents:
  - greet
  - goodbye
  - ask_branch_count
  - ask_branch_list
  - ask_pitches_by_branch
  - ask_available_pitches
  - ask_booking_guide
  - ask_pitch_availability
  - out_of_scope
  - nlu_fallback

entities:
  - branch_name

slots:
  branch_name:
    type: text
    influence_conversation: true
    mappings:
      - type: from_entity
        entity: branch_name

  last_pitch_name:
    type: text
    influence_conversation: false
    mappings:
      - type: custom

  last_booking_date:
    type: text
    influence_conversation: false
    mappings:
      - type: custom

  last_start_time:
    type: text
    influence_conversation: false
    mappings:
      - type: custom

  last_end_time:
    type: text
    influence_conversation: false
    mappings:
      - type: custom

actions:
  - action_greet
  - action_goodbye
  - action_fallback
  - action_booking_guide
  - action_count_branches
  - action_list_branches
  - action_list_pitches_by_branch
  - action_check_available_pitches_by_branch
  - action_check_pitch_availability