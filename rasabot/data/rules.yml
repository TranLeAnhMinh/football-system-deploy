version: "3.1"

rules:
- rule: greet
  steps:
    - intent: greet
    - action: action_greet

- rule: goodbye
  steps:
    - intent: goodbye
    - action: action_goodbye

- rule: count branches
  steps:
    - intent: ask_branch_count
    - action: action_count_branches

- rule: list branches
  steps:
    - intent: ask_branch_list
    - action: action_list_branches

- rule: list pitches by branch
  steps:
    - intent: ask_pitches_by_branch
    - action: action_list_pitches_by_branch

- rule: out of scope
  steps:
    - intent: out_of_scope
    - action: action_fallback

- rule: nlu fallback
  steps:
    - intent: nlu_fallback
    - action: action_fallback

- rule: check available pitches by branch
  steps:
    - intent: ask_available_pitches
    - action: action_check_available_pitches_by_branch

- rule: check pitch availability
  steps:
    - intent: ask_pitch_availability
    - action: action_check_pitch_availability

- rule: guide booking
  steps:
    - intent: ask_booking_guide
    - action: action_booking_guide