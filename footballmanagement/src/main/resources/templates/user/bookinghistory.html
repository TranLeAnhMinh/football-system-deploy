<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <title th:text="#{booking.history.title}">Booking History</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Playfair+Display:wght@600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" th:href="@{/css/home.css}">
  <link rel="stylesheet" th:href="@{/css/bookinghistory.css}">
  <link rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
  <script th:inline="javascript">
    const statusTextMap = {
        PENDING: /*[[#{status.pending}]]*/ "Pending",
        APPROVED: /*[[#{status.approved}]]*/ "Approved",
        PAID: /*[[#{status.paid}]]*/ "Paid",
        CHECKED_IN: /*[[#{status.checked_in}]]*/ "Checked in",
        CANCELLED: /*[[#{status.cancelled}]]*/ "Cancelled",
        NO_SHOW: /*[[#{status.no_show}]]*/ "No show",
        WAITING_REFUND: /*[[#{status.waiting_refund}]]*/ "Waiting refund",
        REFUNDED: /*[[#{status.refunded}]]*/ "Refunded"
    };
    const paymentStatusTextMap = {
        INITIATED: /*[[#{payment.status.initiated}]]*/ "Initiated",
        PAID: /*[[#{payment.status.paid}]]*/ "Paid",
        FAILED: /*[[#{payment.status.failed}]]*/ "Failed",
        CANCELED: /*[[#{payment.status.canceled}]]*/ "Canceled"
    };
    const bookingNoDataText = /*[[#{booking.table.noData}]]*/ "No booking history yet";
    const bookingViewText = /*[[#{booking.table.view}]]*/ "View";
    const paginationRangeText = /*[[#{pagination.range}]]*/ "{0}-{1} / {2} items";
  </script>

  <script defer th:src="@{/js/bookinghistory.js}"></script>
  <script th:src="@{/js/auth.js}"></script>
</head>
<body onload="loadBookingHistory(0)">

<div class="home-container">
  <div th:replace="layouts/sidebar :: sidebar"></div>

  <div class="main-content">
    <div class="booking-history-container">
      <h2 th:text="#{booking.history.title}">Booking History</h2>

      <div class="bh-toolbar">
        <div class="bh-left">
          <label for="pageSize" th:text="#{booking.history.show}">Show</label>
          <select id="pageSize" onchange="changePageSize(this.value)">
            <option value="5">5</option>
            <option value="10" selected>10</option>
            <option value="20">20</option>
          </select>
          <span th:text="#{booking.history.itemsPerPage}">items / page</span>
        </div>
        <div class="bh-right">
          <span id="summaryText"></span>
        </div>
      </div>

      <table class="booking-table">
        <thead>
        <tr>
          <th>#</th>
          <th th:text="#{booking.table.pitch}">Pitch</th>
          <th th:text="#{booking.table.branch}">Branch</th>
          <th th:text="#{booking.table.date}">Booking Date</th>
          <th th:text="#{booking.table.status}">Status</th>
          <th th:text="#{payment.status}">Payment</th>
          <th th:text="#{booking.table.price}">Price</th>
          <th th:text="#{booking.table.detail}">Detail</th>
        </tr>
        </thead>
        <tbody id="bookingList"></tbody>
      </table>

      <div class="pagination" id="pagination"></div>
    </div>
  </div>
</div>

<div id="bookingModal" class="modal">
  <div class="modal-content">
    <div class="modal-header">
      <h3 th:text="#{booking.summary.title}">Booking Summary</h3>
      <button class="close-btn" onclick="closeModal()">&times;</button>
    </div>

    <div class="modal-body">
      <p><strong th:text="#{booking.summary.pitch}">Pitch:</strong> <span id="modalPitchName"></span></p>
      <p><strong th:text="#{booking.summary.branch}">Branch:</strong> <span id="modalBranchName"></span></p>
      <p><strong th:text="#{booking.summary.user}">Booked by:</strong> <span id="modalUserName"></span></p>
      <p><strong th:text="#{booking.summary.date}">Booking Date:</strong> <span id="modalBookingDate"></span></p>
      <p><strong th:text="#{booking.summary.status}">Status:</strong> <span id="modalStatus"></span></p>
      <p><strong th:text="#{booking.summary.note}">Note:</strong> <span id="modalNote"></span></p>

      <div class="payment-detail-box">
        <h4 th:text="#{payment.detail.title}">Payment Detail</h4>
        <p><strong th:text="#{payment.status}">Payment:</strong> <span id="modalPaymentStatus"></span></p>
        <p><strong th:text="#{payment.txnRef}">Txn Ref:</strong> <span id="modalTxnRef"></span></p>
        <p><strong th:text="#{payment.vnpTransactionNo}">VNPay No:</strong> <span id="modalVnpNo"></span></p>
        <p><strong th:text="#{payment.bankCode}">Bank:</strong> <span id="modalBankCode"></span></p>
        <p><strong th:text="#{payment.payDate}">Pay Date:</strong> <span id="modalPayDate"></span></p>
      </div>

      <div id="modalSlotsSection">
        <h4 th:text="#{booking.summary.slots}">Booked Slots</h4>
        <ul id="modalSlotsList"></ul>
      </div>

      <div class="modal-footer">
        <button class="close-btn-footer" th:text="#{booking.close}" onclick="closeModal()">Close</button>
      </div>
    </div>
  </div>
</div>

</body>
</html>
