<div th:fragment="chatbot">

  <link rel="stylesheet" th:href="@{/css/chatbot.css}">

  <div id="chatbot-icon">
    <i class="fa-solid fa-comments"></i>
  </div>

  <div id="chatbot-window" class="hidden">

    <div class="chat-header">
      <span th:text="#{chatbot.title}">Football Assistant</span>
      <button id="chatbot-close">✖</button>
    </div>

    <div id="chatbot-messages">
      <div class="msg bot welcome-message" th:text="#{chatbot.welcome}">
        Chào bạn, tôi có thể hướng dẫn bạn cách đặt sân, xem chi nhánh, danh sách sân, sân theo từng chi nhánh và tra cứu giờ trống của sân.
      </div>
    </div>

    <div id="chatbot-suggestions">
      <button class="suggestion-btn" th:text="#{chatbot.suggestion.booking}">
        Cách đặt sân bóng như thế nào?
      </button>

      <button class="suggestion-btn" th:text="#{chatbot.suggestion.branches}">
        Danh sách các chi nhánh?
      </button>
    </div>

    <div class="chat-input">
      <input id="chatbot-input" th:placeholder="#{chatbot.placeholder}" placeholder="Hỏi về sân bóng..." />
      <button id="chatbot-send" th:text="#{chatbot.send}">Gửi</button>
    </div>

  </div>

  <script th:src="@{/js/chatbot.js}" defer></script>

</div>
