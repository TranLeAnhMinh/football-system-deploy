<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title th:text="#{branch1.list.title}">Branch List</title>

    <link rel="stylesheet" th:href="@{/css/home.css}">
    <link rel="stylesheet" th:href="@{/css/adminsystembranchpage.css}">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"/>
</head>

<body>

<div class="home-container">

    <div th:replace="layouts/adminsystemsidebar :: adminSystemSidebar"></div>

    <div class="main-content">

        <div class="branch-container">

            <div class="branch-header">
                <h2 th:text="#{branch1.list.title}">Danh sách chi nhánh</h2>

                <button class="btn-add-branch"
                        data-bs-toggle="modal"
                        data-bs-target="#createBranchModal"
                        th:text="#{branch1.add.button}">
                </button>
            </div>

            <div id="branchContainer"></div>

        </div>
    </div>
</div>

<!-- MODAL TẠO CHI NHÁNH -->
<div class="modal fade" id="createBranchModal" tabindex="-1">
    <div class="modal-dialog">
        <div class="modal-content">

            <form id="createBranchForm">
                <div class="modal-header">
                    <h5 class="modal-title" th:text="#{branch1.modal.title}">Tạo chi nhánh mới</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>

                <div class="modal-body">
                    <label th:text="#{branch1.name}">Tên chi nhánh</label>
                    <input name="name" class="form-control" required>

                    <label class="mt-2" th:text="#{branch1.location}">Địa chỉ</label>
                    <input name="location" class="form-control" required>

                    <label class="mt-2" th:text="#{branch1.description}">Mô tả</label>
                    <textarea name="description" class="form-control"></textarea>
                </div>

                <div class="modal-footer">
                    <button type="button"
                            class="btn btn-secondary"
                            data-bs-dismiss="modal"
                            th:text="#{button1.cancel}">
                    </button>

                    <button type="submit"
                            class="btn btn-success"
                            th:text="#{button1.create}">
                    </button>
                </div>

            </form>

        </div>
    </div>
</div>

<!-- MODAL CHỈNH SỬA CHI NHÁNH -->
<div class="modal fade" id="editBranchModal" tabindex="-1">
    <div class="modal-dialog">
        <div class="modal-content">

            <form id="editBranchForm">
                <input type="hidden" id="editBranchId" name="id">

                <div class="modal-header">
                    <h5 class="modal-title" th:text="#{branch.edit.title}">Edit branch</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>

                <div class="modal-body">
                    <label th:text="#{branch1.name}">Tên chi nhánh</label>
                    <input id="editBranchName" name="name" class="form-control" required>

                    <label class="mt-2" th:text="#{branch1.location}">Địa chỉ</label>
                    <input id="editBranchLocation" name="location" class="form-control" required>

                    <label class="mt-2" th:text="#{branch1.description}">Mô tả</label>
                    <textarea id="editBranchDescription" name="description" class="form-control"></textarea>
                </div>

                <div class="modal-footer">
                    <button type="button"
                            class="btn btn-secondary"
                            data-bs-dismiss="modal"
                            th:text="#{button1.cancel}">
                    </button>

                    <button type="submit"
                            class="btn btn-primary"
                            th:text="#{branch.edit.save}">
                        Save
                    </button>
                </div>
            </form>

        </div>
    </div>
</div>

<!-- MODAL: TẠO SÂN MỚI -->
<div class="modal fade" id="createPitchModal" tabindex="-1">
    <div class="modal-dialog modal-lg">
        <div class="modal-content">

            <form id="createPitchForm" enctype="multipart/form-data">
                <input type="hidden" id="pitchBranchId" name="branchId">

                <div class="modal-header">
                    <h5 class="modal-title">
                        <span th:text="#{pitch1.add.title}"></span>
                        <span id="pitchBranchName" class="text-primary"></span>
                    </h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>

                <div class="modal-body">

                    <label th:text="#{pitch1.name}">Tên sân</label>
                    <input name="name" class="form-control" required>

                    <label class="mt-2" th:text="#{pitch1.location}">Vị trí</label>
                    <input name="location" class="form-control" required>

                    <label class="mt-2" th:text="#{pitch1.description}">Mô tả</label>
                    <textarea name="description" class="form-control"></textarea>

                    <label class="mt-3" th:text="#{pitch1.type}">Loại sân</label>
                    <select name="pitchTypeId" class="form-select" required>
                        <option value="5" th:text="#{pitch.type.5}">5 người</option>
                        <option value="7" th:text="#{pitch.type.7}">7 người</option>
                        <option value="11" th:text="#{pitch.type.11}">11 người</option>
                    </select>

                    <label class="mt-3" th:text="#{pitch1.images}">Ảnh sân</label>

                    <div class="custom-file-upload">
                        <label id="fileLabel" class="file-btn">
                            <i class="fa-solid fa-upload"></i>
                            <span id="fileText" th:text="#{pitch1.chooseFile}">Choose file</span>
                            <input type="file" name="file" id="pitchFiles" multiple hidden>
                        </label>
                    </div>

                    <p class="file-info" id="fileInfo" th:text="#{pitch1.noFile}">No file selected</p>

                </div>

                <div class="modal-footer">
                    <button type="button"
                            class="btn btn-secondary"
                            data-bs-dismiss="modal"
                            th:text="#{button1.cancel}">
                        Cancel
                    </button>

                    <button type="submit"
                            class="btn btn-primary"
                            th:text="#{button1.create}">
                        Tạo sân
                    </button>
                </div>

            </form>

        </div>
    </div>
</div>

<!-- I18N -->
<script th:inline="javascript">
    const i18n = {
        loading: /*[[#{loading}]]*/ "Loading...",
        error: /*[[#{error}]]*/ "Error",
        empty: /*[[#{empty}]]*/ "No data",
        statusActive: /*[[#{pitch.status.active}]]*/ "Active",
        statusInactive: /*[[#{pitch.status.inactive}]]*/ "Inactive",
        addPitch: /*[[#{add.pitch}]]*/ "Add pitch",
        type: /*[[#{pitch1.type}]]*/ "Pitch type",
        images: /*[[#{pitch1.images}]]*/ "Pitch images",
        chooseFile: /*[[#{pitch1.chooseFile}]]*/ "Choose file",
        noFile: /*[[#{pitch1.noFile}]]*/ "No file selected",
        creatingPitch: /*[[#{pitch1.creating}]]*/ "Creating...",
        priceConfigMissing: /*[[#{pitch.price.missing}]]*/ "Missing price configuration",
        priceConfigMissingShort: /*[[#{pitch.price.missing.short}]]*/ "Missing price",

        editBranch: /*[[#{branch.edit}]]*/ "Edit branch",
        editBranchTitle: /*[[#{branch.edit.title}]]*/ "Edit branch",
        editBranchSave: /*[[#{branch.edit.save}]]*/ "Save",
        branchUpdateSuccess: /*[[#{branch.update.success}]]*/ "Branch updated",

        pitchImageChoose: /*[[#{pitch.image.choose}]]*/ "Choose image",
        pitchImageUpload: /*[[#{pitch.image.upload}]]*/ "Upload image",
        pitchImageNoFile: /*[[#{pitch.image.noFile}]]*/ "No file selected",
        pitchImageDelete: /*[[#{pitch.image.delete}]]*/ "Delete image",
        pitchImageDeleteConfirm: /*[[#{pitch.image.deleteConfirm}]]*/ "Delete this image?",
        pitchImageDeleteSuccess: /*[[#{pitch.image.deleteSuccess}]]*/ "Image deleted",
        pitchImageDeleteFail: /*[[#{pitch.image.deleteFail}]]*/ "Delete failed",
        pitchImageUploadSuccess: /*[[#{pitch.image.uploadSuccess}]]*/ "Image uploaded",
        pitchImageUploadFail: /*[[#{pitch.image.uploadFail}]]*/ "Upload failed",
        pitchImageUploadEmpty: /*[[#{pitch.image.uploadEmpty}]]*/ "Please choose an image",
        pitchImageCover: /*[[#{pitch.image.cover}]]*/ "Cover"
    };
</script>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script th:src="@{/js/auth.js}"></script>
<script src="/js/adminsystem-branches.js"></script>

<script>
    loadAdminBranches();

    document.getElementById("createBranchForm").addEventListener("submit", async (e) => {
        e.preventDefault();

        const payload = {
            name: e.target.name.value,
            location: e.target.location.value,
            description: e.target.description.value
        };

        const res = await fetch("/api/adminsystem/branches", {
            method: "POST",
            headers: {
                "Content-Type": "application/json",
            },
            body: JSON.stringify(payload)
        });

        if (!res.ok) {
            alert(i18n.error);
            return;
        }

        loadAdminBranches();
        bootstrap.Modal.getInstance(document.getElementById("createBranchModal")).hide();
    });
</script>

</body>
</html>
