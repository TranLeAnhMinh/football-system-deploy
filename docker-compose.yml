services:
  spring-app:
    build:
      context: ./footballmanagement
    ports:
      - "8080:8080"
    restart: unless-stopped
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://ep-blue-haze-a1190ij1-pooler.ap-southeast-1.aws.neon.tech/neondb?sslmode=require
      SPRING_DATASOURCE_USERNAME: neondb_owner
      SPRING_DATASOURCE_PASSWORD: npg_PdqZYtef96jl

  rasa:
    build:
      context: ./rasabot
      dockerfile: Dockerfile
    ports:
      - "5005:5005"
    restart: unless-stopped
    depends_on:
      - rasa-actions

  rasa-actions:
    build:
      context: ./rasabot
      dockerfile: Dockerfile.actions
    ports:
      - "5055:5055"
    restart: unless-stopped
    environment:
      DB_HOST: ep-blue-haze-a1190ij1-pooler.ap-southeast-1.aws.neon.tech
      DB_PORT: 5432
      DB_NAME: neondb
      DB_USER: neondb_owner
      DB_PASSWORD: npg_PdqZYtef96jl

  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - spring-app
      - rasa
    restart: unless-stopped